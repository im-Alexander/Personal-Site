<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Poster Project</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">
</head>
<style>
  * {
    background-color: black;
  }

  div {
    width: 50%;
    margin: 50px 25%;
  }

  h1 {
    font-family: "Libre Baskerville", serif;
    color: white;
    text-align: center;
    text-transform: uppercase;
  }

  p {
    font-family: "Libre Baskerville", serif;
    color: white;
    text-align: center;
  }

  img {
    border: 5px solid white;
    width: 100%;
  }
</style>

<body>
  <div>
    <img src="./assets/images/funny_cat.png" alt="a cat making a funny face" />
    <h1>That moment when</h1>
    <p>Your mom is making cookies :D</p>
  </div>
</body>

</html>
